apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: toolbox-app

labels:
  - pairs:
      app.kubernetes.io/part-of: toolbox-app
    includeSelectors: false

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

images:
  - name: docker.io/adleeafif/toolbox-app
    newTag: 0.1.0 # semver; the release workflow replaces this in the runner checkout
